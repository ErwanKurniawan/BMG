name: BMG Website CI/CD

# Berjalan otomatis setiap ada push ke branch main.
on:
  push:
    branches: [main]

# Opsi: izinkan trigger manual dari tab Actions.
  workflow_dispatch:

# Build butuh membaca isi repo; deploy butuh pages: write + token OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Hindari deploy ganda beruntun; deploy yang sedang berjalan tidak dibatalkan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil source code dari repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Siapkan Node.js 22 (sesuai engines vite@8: ^20.19.0 || >=22.12.0)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies secara reproducible dari package-lock.json
      #    (gagal otomatis jika npm ci gagal, mis. lock tidak sinkron)
      - name: Install dependencies
        run: npm ci

      # 4. Build produksi; step ini GAGAL jika build error
      - name: Build
        run: npm run build

      # 5. Enable/validasi konfigurasi GitHub Pages untuk repo ini
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 6. Upload hasil build (dist/) sebagai Pages artifact untuk job deploy
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    # Environment resmi GitHub Pages; URL hasil deploy ditampilkan di tab Environments.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 7. Publish artifact ke GitHub Pages (butuh source repo = "GitHub Actions")
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
